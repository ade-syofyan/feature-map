# Feature Map - Registry Flow Bisnis
# Source-of-truth untuk plugin feature-map itu sendiri (dogfooding)

flows:
  feature-map-plugin:
    description: "Plugin feature-map untuk tracking flow bisnis lintas layer"
    confidence: reviewed
    policy: "Perubahan kontrak atau aturan touchpoint harus disinkronkan; tampilan murni tidak"
    business_aspects:
      - validation
      - status
    touchpoints:
      # Core plugin (Claude Code / Codex)
      - path: "skills/feature-map/SKILL.md"
        role: docs
        note: "Behavioral guidelines untuk agent"
      - path: "hooks/*.py"
        role: backend-service
        note: "Hook scripts untuk Claude Code/Codex"
      - path: "commands/*.md"
        role: docs
        note: "Command documentation"
      - path: ".claude-plugin/plugin.json"
        role: backend-validation
        note: "Plugin configuration"
      # Freebuff adapter
      - path: "freebuff/freebuff_adapter.py"
        role: backend-service
        note: "Freebuff adapter utama — semua command"
      - path: "freebuff/*.md"
        role: docs
        note: "Freebuff documentation (README, CHANGELOG, COMMANDS)"
      - path: "freebuff/*.sh"
        role: backend-service
        note: "Freebuff shell scripts (setup, install hook)"
      - path: ".freebuff/hooks.json"
        role: backend-validation
        note: "Freebuff hook configuration"
      - path: "skills/feature-map/SKILL_FREEBUFF.md"
        role: docs
        note: "Behavioral guidelines khusus Freebuff"
    invariants:
      - "SKILL.md harus selalu ada dan terbaca oleh agent"
      - "Hook scripts harus bisa parse FEATURE-MAP.yaml"
      - "Touchpoint paths harus valid dan bisa di-match"
      - "freebuff_adapter.py harus handle semua command di hooks.json"
    mechanics_doc: "freebuff/README.md"
    history:
      - date: "2026-08-31"
        sha: "freebuff-adapter"
        author: "Buffy"
        change: "Menambahkan Freebuff adapter untuk hooks dan commands"

  edition-policy:
    description: "Batas edisi gratis dan pengumuman Pro berbayar"
    confidence: reviewed
    policy: "Semua fitur lama tetap gratis; Pro hanya menambah fitur baru di repo privat"
    business_aspects:
      - visibility
    touchpoints:
      - path: "README.md"
        role: docs
      - path: "README.id.md"
        role: docs
      - path: "GUIDE.md"
        role: docs
      - path: "assets/*.svg"
        role: docs
      - path: "docs/DESIGN.md"
        role: docs
      - path: "PRO.md"
        role: docs
      - path: "LICENSE"
        role: docs
    invariants:
      - "Semua fitur yang sudah ada di feature-map tetap gratis dengan lisensi MIT"
      - "Fitur Pro yang belum dibuat harus disebut sebagai rencana, bukan fitur tersedia"
      - "Pembelian Pro diarahkan ke ade.syofyan@gmail.com; harga dan ketentuan update dikonfirmasi sebelum pembayaran"

  distribution-privacy:
    description: "Contoh umum dan lokasi pemasangan yang portabel"
    confidence: reviewed
    touchpoints:
      - path: "codex-skill/feature-map/scripts/feature_map_cli.py"
        role: backend-service
      - path: "codex-skill/feature-map/SKILL.md"
        role: docs
      - path: "tests/test_feature_map_cli.py"
        role: backend-validation
      - path: "tests/test_distribution_policy.py"
        role: backend-validation
      - path: "tests/test_fm_registry.py"
        role: backend-validation
      - path: "tests/test_hook_multirepo.py"
        role: backend-validation
      - path: "tests/test_impact_chain.py"
        role: backend-validation
      - path: "BENCHMARK.md"
        role: docs
      - path: "SMOKE.md"
        role: docs
      - path: "README.md"
        role: docs
    invariants:
      - "Contoh harus sintetis dan mandiri, tanpa nama, path, source atau data aplikasi pelanggan"
      - "Lokasi default plugin berasal dari lokasi instalasi, bukan komputer pengembang"
      - "Pengujian harus tetap berjalan tanpa checkout proyek pelanggan"

  notification-policy:
    description: "Reminder sesuai dampak perubahan"
    confidence: reviewed
    touchpoints:
      - path: "hooks/feature_map_hook.py"
        role: backend-service
      - path: "hooks/fm_changes.py"
        role: backend-service
      - path: "tests/test_cosmetic_changes.py"
        role: backend-validation
      - path: "docs/NOTIFICATIONS.md"
        role: docs
      - path: "skills/feature-map/SKILL.md"
        role: docs
      - path: "codex-skill/feature-map/SKILL.md"
        role: docs
    invariants:
      - "Gaya statis yang dikenali pada Edit/MultiEdit lengkap tidak membuat stale, pending atau reminder baru"
      - "Data, struktur, filter, visibilitas dan perubahan tidak dikenal tetap direview"
      - "Konteks rumus yang tetap tidak dihitung sebagai perubahan; kondisi terhapus tetap diperiksa"
      - "Pending sebelumnya tidak dihapus oleh edit tampilan"
    mechanics_doc: "docs/NOTIFICATIONS.md"
