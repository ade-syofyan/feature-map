<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">feature-map — Keep business rules connected.</title>
<desc id="desc">Feature Map provides business-flow context for Claude Code, Codex and Freebuff.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f2851"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#3a5c96" stop-opacity=".5"/><stop offset="1" stop-color="#0f2851" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8fb8ec" stroke-opacity=".06"/></pattern>
</defs>
<rect width="720" height="470" rx="24" fill="url(#bg)"/>
<rect width="720" height="470" rx="24" fill="url(#grid)"/>

<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<g transform="translate(52 46)" fill="none" stroke="#ffb454" stroke-width="2.5"><rect width="34" height="34" rx="10" fill="#ffb454" fill-opacity=".08"/><path d="M10 24V10h14M10 17h14"/><circle cx="24" cy="10" r="2" fill="#ffb454"/><circle cx="24" cy="17" r="2" fill="#ffb454"/></g>
<text x="100" y="72" fill="#f3f8ff" font-size="27" font-weight="650" letter-spacing="-.7">feature-map</text>
<text x="54" y="139" fill="#8fb8ec" font-size="13" font-weight="600" letter-spacing="2.2">BUSINESS CONTEXT FOR CODING AGENTS</text>
<text x="50" y="211" fill="#f3f8ff" font-size="57" font-weight="700" letter-spacing="-2.7">Keep business</text>
<text x="50" y="277" fill="#f3f8ff" font-size="57" font-weight="700" letter-spacing="-2.7">rules <tspan fill="#ffb454">connected.</tspan></text>
<text x="54" y="326" fill="#c3d7f4" font-size="19">Map the flow. Review the change.</text>
<text x="54" y="354" fill="#c3d7f4" font-size="18">Give your agent the context that code alone misses.</text>
<g fill="#8fb8ec" fill-opacity=".1" stroke="#3a5c96"><rect x="54" y="395" width="112" height="32" rx="16"/><rect x="176" y="395" width="76" height="32" rx="16"/><rect x="262" y="395" width="90" height="32" rx="16"/></g>
<g text-anchor="middle" fill="#c3d7f4" font-size="13"><text x="110" y="416">Claude Code</text><text x="214" y="416">Codex</text><text x="307" y="416">Freebuff</text></g>
