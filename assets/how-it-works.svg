<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Map. Edit. Review.</title>
<desc id="desc">Declare touchpoints and invariants, inspect related files when one changes, then audit the flow. Claude Code uses hooks; Codex follows the skill workflow.</desc>
<rect width="1200" height="360" rx="20" fill="#0f2851"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="38" y="47" fill="#8fb8ec" font-size="14" letter-spacing="2">A SMALL FILE. A CLEARER WORKFLOW.</text>
<g fill="#0a1830" stroke="#3a5c96"><rect x="32" y="76" width="356" height="208" rx="14"/><rect x="422" y="76" width="356" height="208" rx="14"/><rect x="812" y="76" width="356" height="208" rx="14"/></g>
<g fill="#ffb454" font-size="14" font-weight="600" letter-spacing="1.4"><text x="58" y="111">01 / DECLARE</text><text x="448" y="111">02 / CHANGE</text><text x="838" y="111">03 / VERIFY</text></g>
<g fill="#f3f8ff" font-size="30" font-weight="650" letter-spacing="-.7"><text x="58" y="159">Map the flow.</text><text x="448" y="159">Edit with context.</text><text x="838" y="159">Review together.</text></g>
<g fill="#c3d7f4" font-size="18"><text x="58" y="195">Connect files that share a rule.</text><text x="58" y="223">Record what must stay true.</text><text x="448" y="195">Find the related touchpoints.</text><text x="448" y="223">Check the impact of the edit.</text><text x="838" y="195">Audit code against the map.</text><text x="838" y="223">Sync intentional rule changes.</text></g>
<path d="M396 180h18m-6-6 6 6-6 6M786 180h18m-6-6 6 6-6 6" fill="none" stroke="#ffb454" stroke-width="2"/>
<text x="38" y="326" fill="#8fb8ec" font-size="15">Claude Code: hook reminders</text><text x="1162" y="326" text-anchor="end" fill="#8fb8ec" font-size="15">Codex: skill workflow + CLI checks</text>
</g></svg>
